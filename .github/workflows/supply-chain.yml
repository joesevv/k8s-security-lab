# ==============================================================================
# Supply-chain CI (phase-4)  -  build -> scan -> SBOM -> keyless-sign-by-digest
# ------------------------------------------------------------------------------
# This workflow is the trusted producer of container images for the lab:
#   1. build      - build app/signed-app and push it to GHCR by per-commit tag.
#   2. scan       - Trivy scans the pushed image (by digest) for CRITICAL/HIGH
#                   CVEs and emits SARIF. Report-only (exit-code 0) so a signed
#                   image is always produced even when findings exist.
#   3. SBOM       - anchore/syft generates an SPDX-JSON SBOM of the same digest.
#   4. sign       - cosign KEYLESS-signs the image BY DIGEST (not the tag) using
#                   the workflow's ambient GitHub OIDC identity (id-token: write).
#                   No private key is stored; the signature is bound to this
#                   workflow's OIDC subject and recorded in the Rekor log.
#
# Kyverno (verifyImages) admits ONLY images signed by THIS workflow's OIDC
# identity, so nothing that did not pass through this pipeline can run in the
# cluster. Signing the immutable digest (not the mutable tag) prevents a
# tag-swap after signing.
#
# Runbook: runbooks/phase-4-supply-chain.md
# ==============================================================================

name: supply-chain

on:
  push:
    branches: [main]
    paths:
      - app/signed-app/**
      - .github/workflows/supply-chain.yml
  workflow_dispatch:

permissions:
  contents: read      # read the repo to build
  packages: write     # push the image to GHCR
  id-token: write     # REQUIRED: mint OIDC token for cosign keyless signing

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: app/signed-app
          push: true
          tags: ghcr.io/joesevv/k8s-security-lab/signed-app:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Trivy scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/joesevv/k8s-security-lab/signed-app@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/joesevv/k8s-security-lab/signed-app@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Keyless sign image by digest
        run: cosign sign --yes ghcr.io/joesevv/k8s-security-lab/signed-app@${{ steps.build.outputs.digest }}

      - name: Record signed digest
        run: |
          echo "Signed: ghcr.io/joesevv/k8s-security-lab/signed-app@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
