# ==============================================================================
# Dependabot - keeps the SHA-pinned GitHub Actions current, and the Go module's
# hash-pinned dependencies with them.
# ------------------------------------------------------------------------------
# .github/workflows/supply-chain.yml pins every action to an immutable 40-char
# commit SHA so a retagged upstream release cannot silently change what runs in
# CI. That pin is only SAFE if something tracks upstream - otherwise the repo
# freezes on a known-vulnerable version forever. This is that something:
# Dependabot opens a weekly PR that bumps the pinned SHA and rewrites the
# trailing `# vX.Y.Z` comment, so the pin stays both immutable and patched.
#
# app/netpol-guard/go.sum is the same shape of promise and carries the same
# failure mode. A module recorded by hash is frozen on exactly the bytes that
# were current the day the entry was written - vulnerabilities included - unless
# something bumps it.
#
# Be precise about what the gomod entry below does and does not add. SECURITY
# updates already arrive WITHOUT it: Dependabot raises advisory-driven bumps for
# any manifest it can see, which is how 72e01c8 (golang.org/x/net 0.47.0 ->
# 0.55.0 in /app/netpol-guard) appeared while this file configured github-actions
# and nothing else. What the entry adds is ROUTINE version updates - the ordinary
# weekly bumps for dependencies with no advisory filed yet - so the module moves
# in small reviewable steps instead of jumping several versions at once on the
# day an advisory finally does land.
#
# Both entries now open onto a real gate. .github/workflows/go-checks.yml builds,
# vets, tests and `go mod verify`s app/netpol-guard on every pull_request that
# touches it, so a gomod PR is checked BEFORE merge. 72e01c8 merged with no such
# check existing.
# ==============================================================================

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # "gomod" is Dependabot's ecosystem key for Go modules (not "go" or "golang").
  # `directory` is the repo-root-relative path to the directory HOLDING go.mod:
  # this module does not live at the repo root, and Dependabot's own PR title on
  # 72e01c8 already reads "in /app/netpol-guard", which is this path.
  # Weekly, to match the sibling entry above.
  - package-ecosystem: "gomod"
    directory: "/app/netpol-guard"
    schedule:
      interval: "weekly"
    # client-go and apimachinery are NOT ordinary dependencies here - they are
    # pinned to the cluster's own version. runbooks/phase-8-netpol-guard.md:109:
    # "client-go v0.35.5 is chosen to match the SERVER's minor and patch", and
    # README.md and docs/threat-model.md repeat that claim. Kubernetes supports
    # a client only within one minor of the apiserver, and THIS cluster cannot
    # move: k8s is held at v1.35.5 because Kyverno 1.18 supports 1.33-1.35 only.
    # So the client tracks the server, and the server is standing still.
    #
    # Dependabot proposed 0.37.0 for both on 2026-09-05 (PRs #25, #26). Those
    # were tested rather than assumed - 0.37.0 builds, passes go test, and runs
    # correctly against the live v1.35.5 apiserver - and closed anyway, because
    # passing is not the same as being the version this repo says it runs.
    #
    # Patch updates stay ALLOWED on purpose: 0.35.6 would still be proposed, so
    # a fix inside the pinned minor is not blocked by this.
    #
    # This is a version-update rule. Do not read it as a guarantee about
    # security advisories - if one ever lands that is only fixed in a later
    # minor, the pin has to be reopened deliberately, together with the cluster
    # version and the five committed claims that describe the match.
    ignore:
      - dependency-name: "k8s.io/client-go"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "k8s.io/apimachinery"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
