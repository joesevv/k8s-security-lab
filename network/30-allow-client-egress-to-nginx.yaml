# Client side of the allow-list: pods labeled access=nginx may send
# egress to the nginx pods (app=nginx) on TCP 8080 only. Both directions
# must be allowed under default-deny — this egress rule on the client
# plus the matching ingress rule on nginx (20-...) — and combined with
# the DNS carve-out (10-...) a labeled client can also resolve the
# service name. No other egress is granted to clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-egress-to-nginx
  namespace: demo
spec:
  podSelector:
    matchLabels:
      access: "nginx"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 8080
