# nginx side of the allow-list: pods labeled app=nginx accept ingress
# ONLY from pods carrying the label access=nginx, and only on TCP 8080
# (the container port behind the Service's port 80). Any pod without
# that label — including a fresh attacker pod in the same namespace —
# stays under default-deny. The access=nginx label is the sole
# discriminator between allowed and blocked clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-ingress-from-client
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: "nginx"
      ports:
        - protocol: TCP
          port: 8080
