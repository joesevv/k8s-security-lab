# Phase 4 — the lab's own workload, published to ghcr.io/joesevv/k8s-security-lab
# and admitted only if its cosign keyless signature verifies against the
# require-keyless-signed-ghcr ImageValidatingPolicy. Mirrors the nginx workload's
# restricted securityContext so signature enforcement is the ONLY new gate here.
#
# The image is pinned as tag@sha256:digest: the tag is the CI commit SHA and the
# digest is the exact artifact the supply-chain workflow built, scanned, SBOM'd
# and cosign keyless-signed (CI run on commit b8483c5 — the FIRST execution of
# the two-job build-scan || sign split, whose sign job ran `cosign verify`
# against the very identity Kyverno pins and passed. That verify runs AFTER the
# image and its signature are already in GHCR, so it gates nothing: it is a
# post-publication self-check that FAILS THE PIPELINE, which stops a signature
# the cluster would reject from shipping silently green — it does not stop one
# from being published).
# Kyverno's require-keyless-signed-ghcr policy verifies that signature again at
# admission.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signed-app
  namespace: demo
  labels:
    app: signed-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signed-app
  template:
    metadata:
      labels:
        app: signed-app
    spec:
      # Dedicated least-privilege identity. Combined with the SA's
      # automountServiceAccountToken: false, no API token is projected into the
      # pod — the signed app needs no cluster access.
      serviceAccountName: signed-app-sa
      # Pod-level security context. runAsNonRoot + RuntimeDefault seccomp satisfy
      # the restricted profile the phase-2b Kyverno policies enforce.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signed-app
          # Pinned by digest for immutability — the exact image bytes cannot
          # drift, and the digest is what cosign verification is anchored to.
          # tag@digest: tag = CI commit SHA, digest = the signed artifact. The
          # digest is what cosign signed and what Kyverno verifies at admission.
          image: ghcr.io/joesevv/k8s-security-lab/signed-app:b8483c5892a16afb16c1a15aaaa35b3c8436dd65@sha256:7fd13d22d934f4202edc164e525436e190498590b62c41e348b1a4092eb3337b
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # readOnlyRootFilesystem is on, so give the app a writable emptyDir for
          # scratch/tmp, mirroring the nginx workload.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
