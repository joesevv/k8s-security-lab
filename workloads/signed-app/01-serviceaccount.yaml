apiVersion: v1
kind: ServiceAccount
metadata:
  name: signed-app-sa
  namespace: demo
  labels:
    app: signed-app
# The signed demo app needs no Kubernetes API access, so its SA never mounts a
# token. Disabling automount at the SA level covers every pod that uses it
# (defence in depth vs. relying only on the pod spec) — same pattern as nginx-sa.
automountServiceAccountToken: false
