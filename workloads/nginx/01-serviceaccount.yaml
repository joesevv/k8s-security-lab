apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
  namespace: demo
  labels:
    app: nginx
# nginx serves static content and needs no Kubernetes API access, so the SA
# never mounts a token. Disabling automount at the SA level covers every pod
# that uses it (defence in depth vs. relying only on the pod spec).
automountServiceAccountToken: false
