# Phase 2b — deny any container (incl. init + ephemeral) running privileged.
# apiVersion resolved on-cluster (see clusters/kyverno-install.md).
# Scoped to the demo namespace only — deliberate lab choice, see runbook.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [demo]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
        c.?securityContext.?privileged.orValue(false) == false)
      message: >-
        Privileged containers are not allowed: every container (including init
        and ephemeral containers) must not set securityContext.privileged=true.
