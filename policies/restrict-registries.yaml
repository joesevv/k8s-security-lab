# Phase 2b — allow images only from the trusted set: Docker Hub
# nginxinc/* (the lab's nginx) and curlimages/* (the lab's curl test image).
# Phase 4 — ghcr.io/joesevv/k8s-security-lab/* is now ALSO allowed: it is the
# registry path for this lab's own signed app, whose keyless cosign signature is
# separately enforced by the require-keyless-signed-ghcr ImageValidatingPolicy.
# Uses Kyverno's CEL image() library, which normalizes registry-less literals
# like 'nginxinc/nginx-unprivileged:1.29.8-alpine' to registry
# 'index.docker.io' (verified on-cluster — NOT 'docker.io').
# Scoped to the demo and demo-kyverno-only namespaces — deliberate lab choice,
# see runbook.
#
# COVERAGE: this policy matches bare Pods, the pods/ephemeralcontainers
# subresource (the `kubectl debug` injection vector), AND pod controllers
# directly — apps/v1 deployments, statefulsets, daemonsets, replicasets and
# batch/v1 jobs, cronjobs. That coverage comes from the explicit resourceRules
# below, NOT from Kyverno autogen: `spec.autogen.podControllers` is a NO-OP on
# Kyverno 1.18.2 (status.autogen stays `{}` and a privileged Deployment was
# ADMITTED at exit 0 — verified on-cluster), so the autogen block was removed
# rather than left in place looking like coverage it did not provide.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-registries
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [demo, demo-kyverno-only]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    # Resolve the three pod-spec shapes this policy now receives, so one CEL
    # expression covers all of them. Declaration order matters: Kyverno
    # evaluates variables top-down, so podSpec must precede allContainers.
    #   CronJob                                    -> spec.jobTemplate.spec.template.spec
    #   Deployment/StatefulSet/DaemonSet/RS/Job    -> spec.template.spec
    #   Pod (and pods/ephemeralcontainers)         -> spec
    - name: podSpec
      expression: >-
        has(object.spec.jobTemplate)
        ? object.spec.jobTemplate.spec.template.spec
        : (has(object.spec.template) ? object.spec.template.spec : object.spec)
    - name: allContainers
      expression: >-
        variables.podSpec.containers
        + variables.podSpec.?initContainers.orValue([])
        + variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
        (image(c.image).registry() == 'index.docker.io'
        && (image(c.image).repository().startsWith('nginxinc/')
        || image(c.image).repository().startsWith('curlimages/')))
        || (image(c.image).registry() == 'ghcr.io'
        && image(c.image).repository().startsWith('joesevv/k8s-security-lab/')))
      message: >-
        Image registry not allowed: every container (including init and
        ephemeral containers) must use an image from Docker Hub nginxinc/* or
        curlimages/*, or ghcr.io/joesevv/k8s-security-lab/*.
