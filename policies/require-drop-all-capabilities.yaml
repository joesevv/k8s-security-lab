# Phase 2b — deny unless every container drops ALL Linux capabilities.
# Scoped to the demo namespace only — deliberate lab choice, see runbook.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-drop-all-capabilities
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [demo]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
        c.?securityContext.?capabilities.?drop.orValue([]).exists(cap,
        cap == 'ALL'))
      message: >-
        Every container (including init and ephemeral containers) must set
        securityContext.capabilities.drop to include "ALL".
