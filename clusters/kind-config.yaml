# kind cluster for k8s-security-lab.
#
# Kubernetes is pinned to v1.35.5 on purpose: the next phase installs Kyverno
# 1.18, which supports Kubernetes 1.33-1.35 only. Staying at the top of that
# window (1.35) gives the newest supported control plane without breaking
# Kyverno.
#
# The node image is pinned by digest as well as tag. This exact digest is the
# v1.35.5 image published for the kind v0.32.0 release, so `kind create` pulls a
# byte-identical node image on every host and cannot drift to a different build.
#
# Topology: 1 control-plane + 2 workers. No extraPortMappings — cluster access
# is via `kubectl port-forward`.
#
# ---------------------------------------------------------------------------
# kubeadmConfigPatches: phase 5b, the CIS findings this file is what fixes.
#
# Phase 5 scanned the cluster and triaged the results; it changed nothing. The
# items below are the subset of that triage which is fixable in cluster
# configuration, so they are fixed here, as code, and the cluster is rebuilt
# from this file rather than patched in place. Each entry names the CIS check
# it targets:
#
#   apiServer  profiling=false                  1.2.15
#   apiServer  enable-admission-plugins         1.2.11 (AlwaysPullImages)
#   apiServer  kubelet-certificate-authority    1.2.5
#   controllerManager  profiling=false          1.3.2
#   scheduler  profiling=false                  1.4.1
#   kubelet    seccompDefault: true             4.2.14
#   kubelet    podPidsLimit: 4096               4.2.13
#   kubelet    serverTLSBootstrap: true         improves 4.2.9
#
# WHY runtime-config AND enable-hostpath-provisioner ARE RESTATED HERE, EVEN
# THOUGH THIS FILE IS NOT WHAT SETS THEM. The live kubeadm-config ConfigMap is
# kubeadm.k8s.io/v1beta4, in which `extraArgs` is a LIST of name/value pairs,
# not a map. kind injects two of its own entries into that list — `runtime-config: ""`
# on the apiServer and `enable-hostpath-provisioner: "true"` on the controller
# manager. A patch against a list may REPLACE it wholesale rather than merge
# into it, and which of those two happens is not something this file controls.
# Restating kind's entries makes the outcome the same either way: under replace
# semantics they survive because they are written here, and under append
# semantics they are already present and are not duplicated into a conflict.
# Dropping them would silently remove the hostpath provisioner and change the
# apiserver's runtime-config on a rebuild.
#
# AlwaysPullImages is present because the pull-gate passed on 2026-07-30. The
# plugin makes the kubelet re-pull every image on every pod create, so a
# cluster built with it can only come up if the registry actually serves the
# images kind preloads — kindnetd, local-path-provisioner, kube-proxy and
# coredns were each pulled by digest from a node before this entry was added.
# If that gate had failed the entry would have been omitted entirely, leaving
# kubeadm's default NodeRestriction untouched. Re-run the gate before any
# rebuild on a host that cannot reach docker.io and registry.k8s.io.
#
# podPidsLimit: 4096 is a lab value, not a derived one. Check 4.2.13 asks only
# that a limit be set, not that it be any particular number; 4096 is high
# enough that no workload in this lab approaches it and low enough to bound a
# fork bomb.
#
# serverTLSBootstrap: true is NOT self-completing. Each kubelet stops
# self-signing its serving certificate and instead files a CSR that nothing
# approves automatically, so `kubectl logs`, `exec` and `top` against pods on a
# node stay broken until that node's CSR is approved by hand. Approving all
# three is a required step of the rebuild, not an optional follow-up — see
# runbooks/phase-5b-cis-remediation.md section 5.
# ---------------------------------------------------------------------------
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: seclab
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
      # restated from kind's own injection, see header
      - name: runtime-config
        value: ""
      # CIS 1.2.15
      - name: profiling
        value: "false"
      # CIS 1.2.11 — NodeRestriction is kubeadm's default and is restated so
      # that adding AlwaysPullImages does not drop it
      - name: enable-admission-plugins
        value: NodeRestriction,AlwaysPullImages
      # CIS 1.2.5
      - name: kubelet-certificate-authority
        value: /etc/kubernetes/pki/ca.crt
    controllerManager:
      extraArgs:
      # restated from kind's own injection, see header
      - name: enable-hostpath-provisioner
        value: "true"
      # CIS 1.3.2
      - name: profiling
        value: "false"
    scheduler:
      extraArgs:
      # CIS 1.4.1
      - name: profiling
        value: "false"
  - |
    kind: KubeletConfiguration
    # CIS 4.2.14
    seccompDefault: true
    # CIS 4.2.13
    podPidsLimit: 4096
    # improves CIS 4.2.9 — requires per-node CSR approval after boot
    serverTLSBootstrap: true
nodes:
  - role: control-plane
    image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
  - role: worker
    image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
  - role: worker
    image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
