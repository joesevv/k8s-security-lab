# Phase 6 PLACEMENT PROBE - the SAME Falco pod spec, as a bare Pod, in demo.
#
# WHAT THIS IS: the `spec.template` block of falco-daemonset-rendered.yaml,
# lifted verbatim into a v1 Pod, with `namespace: demo` added. The podSpec is
# byte-identical to the DaemonSet's; that is checked in attack-output.txt by
# diffing the two extracted podSpecs, not asserted.
#
# WHY BOTH FORMS EXIST: because they get different answers, and collapsing them
# into one claim would be false. PodSecurity Admission evaluates POD objects. A
# DaemonSet is not a Pod, so PSA only warns on it. A Pod form was therefore
# needed to make PSA answer at all.
#
# WHAT ACTUALLY HAPPENED TO THIS FILE, AND WHY IT IS NOT THE FILE THAT PROVES
# THE PSA CLAIM. This podSpec is the DaemonSet's byte-for-byte, so it carries
# `serviceAccountName: falco`, and that ServiceAccount exists only in namespace
# falco. Submitted to demo it was refused - but NOT by PSA and NOT by Kyverno:
#
#   Error from server (Forbidden): pods "falco" is forbidden: error looking up
#   service account demo/falco: serviceaccount "falco" not found
#
# That is the built-in ServiceAccount admission plugin, which runs during the
# MUTATING phase, before the PodSecurity validating plugin and before any
# webhook. So the ServiceAccount was resolved during admission and it DECIDED
# the request; PSA never evaluated this object. Writing "PSA refuses the Falco
# pod in demo" on the strength of this file's output would have been false.
# It is committed anyway, and the refusal is transcribed in attack-output.txt
# 4a, because a gotcha that is deleted teaches nobody anything.
#
# THE FILE THAT DOES ESTABLISH THE PSA CLAIM is
# rejected-in-demo-pod-sa-isolated.yaml, which is this spec with
# serviceAccountName changed to `default` and the object renamed - one field of
# substance, diffed in attack-output.txt 4b. That
# one gets past the SA plugin, reaches PSA, and is refused with
# 'violates PodSecurity "restricted:v1.35"' (4c). Read 4a and 4c together or the
# wrong control gets the credit.
#
# NEVER APPLIED FOR REAL. `kubectl apply --server-side --dry-run=server` only.
apiVersion: v1
kind: Pod
metadata:
  name: falco
  namespace: demo
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/instance: falco
  annotations:
    checksum/config: 68520d7afabc71764f9725d07750e0ffe90b3920035bd71ee1b8caa73df805ad
    checksum/rules: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    checksum/certs: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
spec:
  serviceAccountName: falco
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
  containers:
    - name: falco
      image: docker.io/falcosecurity/falco:0.44.1@sha256:d0cfe422d6ac0e0f20857798f46c7d7273210e1b064b22821e4e6e7f843cde6b
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 512Mi
      securityContext:
        privileged: true
      args:
        - /usr/bin/falco        
      env:
        - name: HOST_ROOT
          value: /host
        - name: FALCO_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: FALCO_K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      tty: true
      ports:
        - containerPort: 8765
          name: web
          protocol: TCP
      startupProbe:
        initialDelaySeconds: 3
        timeoutSeconds: 5
        periodSeconds: 5
        failureThreshold: 20
        httpGet:
          path: /healthz
          port: 8765
      livenessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 5
        periodSeconds: 15
        failureThreshold: 3
        httpGet:
          path: /healthz
          port: 8765
      readinessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 5
        periodSeconds: 15
        failureThreshold: 3
        httpGet:
          path: /healthz
          port: 8765
      volumeMounts:
        - mountPath: /host/var/run/docker.sock
          name: container-engine-socket-0
        - mountPath: /host/run/podman/podman.sock
          name: container-engine-socket-1
        - mountPath: /host/run/host-containerd/containerd.sock
          name: container-engine-socket-2
        - mountPath: /host/run/containerd/containerd.sock
          name: container-engine-socket-3
        - mountPath: /host/run/crio/crio.sock
          name: container-engine-socket-4
        - mountPath: /host/run/k3s/containerd/containerd.sock
          name: container-engine-socket-5
        - mountPath: /etc/falco
          name: rulesfiles-install-dir
        - mountPath: /usr/share/falco/plugins
          name: plugins-install-dir
        - mountPath: /root/.falco
          name: root-falco-fs
        - mountPath: /host/proc
          name: proc-fs
        - mountPath: /host/etc
          name: etc-fs
          readOnly: true
        - mountPath: /sys/kernel
          name: sys-fs
          readOnly: true
        - mountPath: /etc/falco/falco.yaml
          name: falco-yaml
          subPath: falco.yaml
  initContainers:
    - name: falcoctl-artifact-install
      image: docker.io/falcosecurity/falcoctl:0.13.0@sha256:0eeb79adc580ae6a5abfdefd7f8f0fed9151fcb545f015c84e8f1d7b2d8a6b02
      imagePullPolicy: IfNotPresent
      args:
        - artifact
        - install
        - --log-format=json
      securityContext:
      volumeMounts:
        - mountPath: /plugins
          name: plugins-install-dir
        - mountPath: /rulesfiles
          name: rulesfiles-install-dir
        - mountPath: /etc/falcoctl
          name: falcoctl-config-volume
        - mountPath: /artifactstate
          name: artifact-state-dir
  volumes:
    - hostPath:
        path: /var/run/docker.sock
      name: container-engine-socket-0
    - hostPath:
        path: /run/podman/podman.sock
      name: container-engine-socket-1
    - hostPath:
        path: /run/host-containerd/containerd.sock
      name: container-engine-socket-2
    - hostPath:
        path: /run/containerd/containerd.sock
      name: container-engine-socket-3
    - hostPath:
        path: /run/crio/crio.sock
      name: container-engine-socket-4
    - hostPath:
        path: /run/k3s/containerd/containerd.sock
      name: container-engine-socket-5
    - name: plugins-install-dir
      emptyDir: {}
    - name: rulesfiles-install-dir
      emptyDir: {}
    - name: artifact-state-dir
      emptyDir: {}
    - name: root-falco-fs
      emptyDir: {}  
    - name: boot-fs
      hostPath:
        path: /boot
    - name: lib-modules
      hostPath:
        path: /lib/modules
    - name: usr-fs
      hostPath:
        path: /usr
    - name: etc-fs
      hostPath:
        path: /etc
    - name: sys-fs
      hostPath:
        path: /sys/kernel
    - name: proc-fs
      hostPath:
        path: /proc
    - name: falcoctl-config-volume
      configMap: 
        name: falco-falcoctl
        items:
          - key: falcoctl.yaml
            path: falcoctl.yaml
    - name: falco-yaml
      configMap:
        name: falco
        items:
        - key: falco.yaml
          path: falco.yaml
